services:
  postgres:
    image: postgres:16-alpine
    container_name: vezolla-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eticaret
    ports:
      - "5433:5432"
    volumes:
      - vezolla_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eticaret"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vezolla_pgdata:
    driver: local

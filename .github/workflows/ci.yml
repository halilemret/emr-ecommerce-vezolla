name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-verify:
    name: Typecheck & Automated Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eticaret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eticaret"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/eticaret
      AUTH_SECRET: test-auth-secret-minimum-32-chars-long
      CRON_SECRET: test-cron-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Synchronize Database Schema
        run: npx prisma db push --accept-data-loss

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run Vitest Test Suite
        run: npm test
